<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farewatch — BUD–MAD</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2b3642;
      --text: #e8eef4;
      --muted: #93a4b5;
      --ok: #3dd68c;
      --partial: #f5c542;
      --err: #ff6b6b;
      --miss: #5c6b7a;
      --accent: #6cb6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    h2 { font-size: 1.15rem; margin: 32px 0 12px; }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .card .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; }
    .card .value { font-size: 1.45rem; font-weight: 650; margin-top: 4px; }
    .cal { display: flex; flex-wrap: wrap; gap: 6px; }
    .day {
      width: 42px; height: 42px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; color: #0b1014; font-weight: 650;
    }
    .day.ok { background: var(--ok); }
    .day.partial { background: var(--partial); }
    .day.error { background: var(--err); }
    .day.missing { background: var(--miss); color: #d7e0ea; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; margin: 10px 0 16px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .empty { color: var(--muted); }
    svg { width: 100%; height: 180px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .hint { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
<main>
  <h1>BUD → MAD jegyárak</h1>
  <p class="sub">Utolsó frissítés: <span id="generated"></span></p>
  <div class="kpis" id="kpis"></div>

  <h2>Gyűjtési napok</h2>
  <p class="hint">Zöld: a napi futás sikerült. Sárga: részben. Piros: volt hiba. Szürke: aznap nem futott.</p>
  <div class="legend">
    <span><i class="sw" style="background:var(--ok)"></i>rendben</span>
    <span><i class="sw" style="background:var(--partial)"></i>részleges</span>
    <span><i class="sw" style="background:var(--err)"></i>hiba</span>
    <span><i class="sw" style="background:var(--miss)"></i>hiányzik</span>
  </div>
  <div class="cal" id="calendar"></div>

  <h2>Sikertelen keresések</h2>
  <div class="card" id="failures"></div>

  <h2>Kitűzött út — 2027. márc. 12–15.</h2>
  <svg id="pinned" viewBox="0 0 1000 180" preserveAspectRatio="none"></svg>
  <p class="hint" id="pinned-caption"></p>

  <h2>Legutóbbi horizont (napi minimum, egyirányú)</h2>
  <svg id="horizon" viewBox="0 0 1000 180" preserveAspectRatio="none"></svg>
</main>

const data = JSON.parse(document.getElementById("payload").textContent);
const $ = (id) => document.getElementById(id);
$("generated").textContent = data.generated_at || "—";

function kpi(label, value) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}
const last = data.last_run || {};
$("kpis").innerHTML = [
  kpi("Utolsó futás", last.collected_on || "nincs"),
  kpi("Sikeres", last.ok ?? "—"),
  kpi("Hiba", last.error ?? "—"),
  kpi("Üres / nincs járat", last.empty ?? "—"),
  kpi("Kitűzött RT min", last.pinned_min != null ? Math.round(last.pinned_min).toLocaleString("hu-HU") + " Ft" : "—"),
].join("");

$("calendar").innerHTML = (data.days || []).map(d => {
  const cls = d.kind;
  const title = `${d.date}: ok=${d.ok} hiba=${d.error} üres=${d.empty}`;
  return `<div class="day ${cls}" title="${title}">${d.date.slice(8)}</div>`;
}).join("") || `<p class="empty">Még nincs gyűjtött nap.</p>`;

const fails = data.failures || [];
$("failures").innerHTML = fails.length
  ? `<table><thead><tr><th>Gyűjtés</th><th>Keresés</th><th>Hiba</th></tr></thead><tbody>${
      fails.map(f => `<tr><td>${f.collected_on}</td><td>${f.trip_type} ${f.origin}–${f.dest} ${f.outbound_date}${f.return_date ? " / "+f.return_date : ""}</td><td>${f.error || "—"}</td></tr>`).join("")
    }</tbody></table>`
  : `<p class="empty">Nincs rögzített hiba.</p>`;

function spark(id, series, yLabel) {
  const svg = $(id);
  if (!series.length) {
    svg.innerHTML = `<text x="20" y="90" fill="#93a4b5">Még nincs elég adat.</text>`;
    return;
  }
  const ys = series.map(p => p.y);
  const min = Math.min(...ys), max = Math.max(...ys);
  const span = (max - min) || 1;
  const w = 1000, h = 180, p = 24;
  const pts = series.map((pt, i) => {
    const x = p + (i / Math.max(series.length - 1, 1)) * (w - 2 * p);
    const y = h - p - ((pt.y - min) / span) * (h - 2 * p);
    return [x, y];
  });
  const d = pts.map((xy, i) => (i ? "L" : "M") + xy[0].toFixed(1) + " " + xy[1].toFixed(1)).join(" ");
  svg.innerHTML = `<polyline fill="none" stroke="#6cb6ff" stroke-width="3" points="${pts.map(xy => xy.join(",")).join(" ")}"></polyline>
    <text x="20" y="22" fill="#93a4b5" font-size="14">${yLabel}: ${Math.round(min).toLocaleString("hu-HU")} – ${Math.round(max).toLocaleString("hu-HU")} Ft</text>`;
}
spark("pinned", data.pinned_series || [], "RT ár");
spark("horizon", data.horizon_series || [], "OW min");
$("pinned-caption").textContent = (data.pinned_series || []).length
  ? "Napi minimum a kitűzött oda-vissza csomagra."
  : "";
</script>
