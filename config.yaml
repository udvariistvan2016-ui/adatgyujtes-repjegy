# BUD–MAD jegyár-gyűjtő — rögzített scope
#
# Forrás: Google Flights a fast-flights könyvtáron keresztül.
# Hivatalos hobbi-API 2026-ban nincs (Amadeus Self-Service leállt, Kiwi/Skyscanner partner).
# Egy aggregátor kell, mert a BUD–MAD legolcsóbb jegy gyakran Wizz/Ryanair.
# Adapter interfész: a source mező később cserélhető (pl. fizetős wrapper).

source: google_flights   # google_flights | mock

origin: BUD
dest: MAD
horizon_days: 180
cabin: economy
adults: 1
currency: HUF            # HUF a magyar kereséshez; EUR-ra cserélhető
language: hu
timezone: Europe/Budapest
direct_only: true

# Megjelenő legolcsóbb ár (LCC-nél jellemzően ülés poggyász nélkül).
# Ne állítsd 1-re, ha az idősor a basic tarifát követi.
carry_on_bags: 0
checked_bags: 0

# Udvarias ritmus: lassú + szórt szünet. A collect.ps1 3–18 perc random késleltetéssel indul.
request_delay_seconds: 5.5
request_jitter_seconds: 3.0
max_retries: 3

collect_hour: "10:00"

# Kitűzött oda-vissza: 2027-03-12 oda, 2027-03-15 vissza (péntek–hétfő).
# collect_oneways: ugyanarra a két napra egyirányú snapshot is (csomag vs két jegy).
pinned_trips:
  - origin: BUD
    dest: MAD
    outbound_date: "2027-03-12"
    return_date: "2027-03-15"
    collect_oneways: true

# Kitűzött rugalmas: oda márc. 10–13. × vissza márc. 14–17. = 16 RT csomag.
# A 12–15. már a pinned_trips-ben van, a gyűjtő nem kéri kétszer.
pinned_flex:
  - origin: BUD
    dest: MAD
    outbound_from: "2027-03-10"
    outbound_to: "2027-03-13"
    return_from: "2027-03-14"
    return_to: "2027-03-17"

# Azori naptár: külön délutáni futás (`collect --scope stay`). A 10:00-es MAD ezt nem látja.
# 7 éj = vissza D+7. 90 nap: a 180-as próba ~2 hónap után csak parser-hiba volt.
stay_horizons:
  - origin: BUD
    dest: PDL
    horizon_days: 90
    stay_nights: 7
    max_stops: 1

# Kézi próba, nem ütemezett: `collect --scope probe`.
# Négy közvetlen egyirányú / nap (BUD–LIS, LIS–PDL, és vissza D+7), összeg = self-transfer becslés.
via_probes:
  - origin: BUD
    via: LIS
    dest: PDL
    stay_nights: 7
    max_stops: 0
    offsets: [14, 21, 28, 35, 42]
